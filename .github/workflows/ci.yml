name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # CC-Server: Build & Test
  # ============================================
  server:
    name: Server - Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cc-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  # ============================================
  # CC-Worker: Build & Test
  # ============================================
  worker:
    name: Worker - Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cc-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  # ============================================
  # Worker Binary Builds (on release tags)
  # ============================================
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, worker]

    defaults:
      run:
        working-directory: cc-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all binaries
        run: pnpm run build:binary:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-worker-binaries
          path: cc-worker/dist/
          retention-days: 30
